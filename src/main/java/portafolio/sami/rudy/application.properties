# =========================================
# CONFIGURACIÓN PÚBLICA PARA SPRING BOOT
# Usando placeholders @...@ para evitar el filtrado de Maven
# =========================================
spring.application.name=Rudy
spring.profiles.active=local

# --- Placeholders para Producción (Koyeb) ---
spring.datasource.url=@DB_URL@
spring.datasource.username=@DB_USERNAME@
spring.datasource.password=@DB_PASSWORD@
jwt.secret=@JWT_SECRET@
jwt.expiration=@JWT_EXPIRATION@
aws.region=@AWS_REGION@
aws.s3.bucketName=@AWS_BUCKET_NAME@
aws.accessKey=@AWS_ACCESS_KEY@
aws.secretKey=@AWS_SECRET_KEY@
aws.s3.endpoint=@AWS_ENDPOINT@
aws.s3.publicUrl=@AWS_PUBLIC_URL@

# --- Configuración General ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
server.error.include-stacktrace=never
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
