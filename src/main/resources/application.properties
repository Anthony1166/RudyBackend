
# =========================================
# CONFIGURACION PUBLICA PARA SPRING BOOT
spring.profiles.active=local
# =========================================
spring.application.name=Rudy

# --- Base de Datos ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- Seguridad JWT ---
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# --- Cloudflare R2 (S3 Compatible) ---
aws.s3.bucketName=${AWS_BUCKET_NAME}
aws.accessKey=${AWS_ACCESS_KEY}
aws.secretKey=${AWS_SECRET_KEY}
aws.s3.endpoint=${AWS_ENDPOINT}
aws.s3.publicUrl=${AWS_PUBLIC_URL}
aws.region=${AWS_REGION}

# --- Configuracion General ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
server.error.include-stacktrace=never

# Aumentar el tamano maximo de los archivos subidos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB