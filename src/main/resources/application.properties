# =========================================
# ARCHIVO DE CONFIGURACIÓN PÚBLICO
# (Este archivo SÍ se sube a GitHub)
# =========================================
spring.application.name=Rudy
# Por defecto, activa el perfil "local" para desarrollo en tu PC.
# Koyeb ignorará o sobreescribirá esta línea.
#spring.profiles.active=local
# --- Placeholders para Producción (Koyeb) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
aws.s3.bucketName=${AWS_BUCKET_NAME}
aws.accessKey=${AWS_ACCESS_KEY}
aws.secretKey=${AWS_SECRET_KEY}
aws.s3.endpoint=${AWS_ENDPOINT}
aws.s3.publicUrl=${AWS_PUBLIC_URL}
# --- Configuración General (común a todos los entornos) ---
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.error.include-stacktrace=never
aws.region=us-east-1