# =========================================
# CONFIGURACION PUBLICA PARA SPRING BOOT
spring.profiles.active=local

# =========================================
spring.application.name=Rudy

# --- Base de Datos ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- Seguridad JWT ---
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# --- Cloudflare R2 (S3 Compatible) ---
aws.s3.bucketName=${AWS_BUCKET_NAME}
aws.accessKey=${AWS_ACCESS_KEY}
aws.secretKey=${AWS_SECRET_KEY}
aws.s3.endpoint=${AWS_ENDPOINT}
aws.s3.publicUrl=${AWS_PUBLIC_URL}
aws.region=${AWS_REGION}

# --- Configuracion General ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
server.error.include-stacktrace=never

# --- Compatibilidad con Supabase PgBouncer ---
spring.datasource.hikari.auto-commit=false
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --- Actuator ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Aumentar el tamano maximo de los archivos subidos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
