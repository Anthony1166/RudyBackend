# ================================================================
# CONFIGURACION PARA TESTS
# ================================================================

# Base de datos en memoria para tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT (valores por defecto para tests)
jwt.secret=test-secret-key-12345678901234567890
jwt.expiration=3600

# AWS (valores dummy para tests)
aws.s3.bucketName=test-bucket
aws.accessKey=test-key
aws.secretKey=test-secret
aws.s3.endpoint=https://test-endpoint.com
aws.s3.publicUrl=https://test-public.com
aws.region=us-east-1
